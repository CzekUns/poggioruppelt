<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina non trovata — Poggio Ruppelt</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .error-page {
      min-height: 100svh;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      background: linear-gradient(160deg, #2a1f2d, #3b2c3e 70%);
      color: #fff;
    }
    .error-page img { width: 130px; margin: 0 auto 1.5rem; }
    .error-page h1 { color: #fff; font-size: clamp(4rem, 14vw, 8rem); line-height: 1; margin-bottom: .2em; }
    .error-page p { color: rgba(255,255,255,.8); max-width: 460px; margin: 0 auto 2rem; }
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <img src="assets/images/logo-poggio-ruppelt-bianco.png" alt="Poggio Ruppelt">
      <h1>404</h1>
      <p>La pagina che cerchi non esiste o è stata spostata. Torna alla home per continuare il tuo viaggio tra i sapori e i panorami flegrei.</p>
      <a href="index.html" class="btn btn-light">Torna alla home</a>
    </div>
  </main>
</body>
</html>
